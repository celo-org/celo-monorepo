name: Protocol Devchain Anvil
on:
  push:
    branches:
      - master
      - 'release/**'
    tags:
      - core-contracts.v*
  pull_request:
    branches: [release/core-contracts/*, master]
    paths:
      - 'packages/protocol/**'
      - '.github/workflows/protocol-devchain-anvil.yml'
  workflow_dispatch:
    inputs:
      npm_tag:
        description: 'NPM TAG e.g. alpha, pre-merge (default: canary) '
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    defaults:
      run:
        working-directory: packages/protocol
    name: Generate anvil
    runs-on: ['self-hosted', 'org', '8-cpu']
    environment:
      name: production
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_type: ${{ steps.release-env.outputs.release_type }}
      release_version: ${{ steps.release-env.outputs.release_version }}
      artifact_name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fail if there are test with wrong extension
        run: |
          if  tree test-sol | grep -i ".sol" | grep -v ".sol"; then
            echo "There are tests with wrong extensions"
            tree test-sol | grep -i ".sol" | grep -v ".sol"
            exit 1
          fi
      # The migration builds every 0.8 contract with the deployed library addresses linked in.
      # The addresses come out the same on every run, so restoring the newest earlier build
      # leaves forge only the sources that changed since then to recompile.
      - name: Foundry build cache
        id: foundry-build
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/protocol/cache
            packages/protocol/cache-solc-0.5
            packages/protocol/out
            packages/protocol/out-solc-0.5
          key: ${{ runner.os }}-foundry-anvil-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-foundry-anvil-build-

      - name: Display SHA
        run: |
          echo "SHA: ${{ github.sha }}"

      - name: Get Pull Request data
        id: get_pr_data
        uses: actions/github-script@v7
        with:
          script: |
            const result = (
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                commit_sha: context.sha,
                owner: context.repo.owner,
                repo: context.repo.repo,
              })
            ).data[0];
            core.setOutput("number", result ? result.number : "");

      - name: Set PR Number
        id: set_pr_number
        run: |
          if [ -z "${{ steps.get_pr_data.outputs.number }}" ]; then
            echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          else
            echo "PR_NUMBER=${{ steps.get_pr_data.outputs.number }}" >> $GITHUB_ENV
          fi

      - name: Display PR Number
        run: |
          echo "Pull Request Number: ${{ env.PR_NUMBER }}"

      - name: Install Foundry
        # foundry-toolchain v1.7.0 https://github.com/foundry-rs/foundry-toolchain/releases/tag/v1.7.0
        uses: foundry-rs/foundry-toolchain@8f1998e9878d786675189ef566a2e4bf24869773
        with:
          # TODO: Standardize Foundry version across workflows https://github.com/celo-org/celo-monorepo/issues/11714
          version: 'v1.5.0'

      - name: Install forge dependencies
        run: forge install

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

#      - name: Akeyless Get Secrets
#        id: get_auth_token
#        uses: docker://us-west1-docker.pkg.dev/devopsre/akeyless-public/akeyless-action:latest
#        with:
#          api-url: https://api.gateway.akeyless.celo-networks-dev.org
#          access-id: p-kf9vjzruht6l
#          static-secrets: '{"/static-secrets/NPM/npm-publish-token":"NPM_TOKEN"}'

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 'Setup yarn'
        shell: bash
        run: |
          npm install --global yarn
          source ~/.bashrc


      - name: 'Install packages'
        shell: bash
        run: yarn

      # The initial state is a function of the optimism revision, the script that derives it
      # and the foundry that runs the script, so a run reuses the state an earlier run built
      # from the same inputs instead of checking optimism out and deriving it again.
      - name: Resolve optimism revision
        id: optimism-rev
        run: |
          sha=$(git ls-remote --exit-code https://github.com/celo-org/optimism.git refs/heads/celo/core-contracts-base | cut -f1)
          [ -n "$sha" ] || { echo "celo/core-contracts-base not found on celo-org/optimism" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Devchain initial state cache
        id: initial-state
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/celo-optimism/packages/contracts-bedrock/anvil-state.json
          key: devchain-initial-state-${{ steps.optimism-rev.outputs.sha }}-${{ hashFiles('packages/protocol/scripts/bash/generate-devchain-initial-state.sh') }}-foundry-v1.5.0
      - name: Checkout Optimism repo
        if: steps.initial-state.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: 'celo-org/optimism'
          # The literal branch, not the resolved sha: a step output as checkout ref reads to
          # CodeQL as untrusted code in a cache-writing workflow. Should the branch move between
          # the two steps, the entry is saved under the older sha, which no later run resolves.
          ref: 'celo/core-contracts-base'
          path: celo-optimism
          submodules: recursive

      - name: Generate initial state for devchain
        if: steps.initial-state.outputs.cache-hit != 'true'
        run: yarn devchain:generate-initial-state --contracts-dir ${{ github.workspace }}/celo-optimism/packages/contracts-bedrock

      - name: Install celocli
        run: |
          sudo npm install -g @celo/celocli@latest --unsafe-perm
          celocli --version

      - name: Generate migrations on local devchain
        if: success() || failure()
        run: |
          LOAD_STATE=${{ github.workspace }}/celo-optimism/packages/contracts-bedrock/anvil-state.json yarn anvil-devchain:start

      # Saved before the devchain tests: their FOUNDRY_PROFILE=devchain build shares cache/ and
      # out/ and rebuilds the sources it needs without the library addresses, which would leave
      # an unlinked build in the cache for the next run to recompile.
      - name: Save foundry build cache
        if: steps.foundry-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            packages/protocol/cache
            packages/protocol/cache-solc-0.5
            packages/protocol/out
            packages/protocol/out-solc-0.5
          key: ${{ runner.os }}-foundry-anvil-build-${{ github.sha }}

      - name: Dump migrated devchain state to l2-devchain.json
        if: success() || failure()
        run: |
          # In LOAD_STATE mode start_anvil.sh omits --dump-state, so anvil-devchain:start
          # never persists the migrated state and the published package ships without a
          # devchain. Dump the still-running anvil over RPC and decompress the gzip+hex
          # payload into the plain-JSON file consumers load via --load-state. python3 does
          # the hex and gzip decoding because the runner image has no xxd.
          source ./scripts/foundry/constants.sh
          cast rpc --rpc-url "$ANVIL_RPC_URL" anvil_dumpState \
            | python3 -c 'import gzip, json, sys; sys.stdout.buffer.write(gzip.decompress(bytes.fromhex(json.load(sys.stdin).removeprefix("0x"))))' \
            > ".tmp/devchain/$L2_DEVCHAIN_FILE_NAME"
          ls -la ".tmp/devchain"

      - name: Run migration tests against local op-geth devchain
        run: |
          source ./scripts/foundry/constants.sh

          FOUNDRY_PROFILE=devchain forge test -vvv --offline \
          --match-path "test-sol/devchain/migration/*" \
          --fork-url $ANVIL_RPC_URL
      
      - name: Run e2e tests against local devchain
        run: |
          source ./scripts/foundry/constants.sh

          # --offline: at -vvv forge decodes every trace and asks openchain.xyz for each signature it
          # cannot resolve locally; one 110M-gas e2e trace turned that into hours of waiting. The
          # local ABIs still decode everything these tests call.
          FOUNDRY_PROFILE=devchain forge test -vvv --offline \
          --match-path "test-sol/devchain/e2e/*" \
          --fork-url $ANVIL_RPC_URL

      - name: Sanitize ref name
        id: sanitize-ref-name
        run: |
          sanitized_ref_name=$(echo "${{ github.ref_name }}" | tr -cd '[:alnum:]-_')
          echo "sanitized_ref_name=${sanitized_ref_name}" >> $GITHUB_ENV

      - name:
          Determine release type and version (or dry run)
          # This is what sets the RELEASE_TYPE and RELEASE_VERSION env variables
        run: yarn --silent release:determine-release-version >> "$GITHUB_ENV"
        working-directory: packages/protocol
        env:
          GITHUB_TAG: ${{ github.ref_name }}
          NPM_PACKAGE: '@celo/devchain-anvil'
          NPM_TAG: ${{ inputs.npm_tag }}

      - name: Set release outputs
        id: release-env
        run: |
          echo "release_type=${{ env.RELEASE_TYPE }}" >> $GITHUB_OUTPUT
          echo "release_version=${{ env.RELEASE_VERSION }}" >> $GITHUB_OUTPUT

      - name: Prepare package for publishing
        run: yarn utils:prepare-devchain-anvil-publishing
        working-directory: packages/protocol
        env:
          RELEASE_TYPE: ${{ env.RELEASE_TYPE }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}

      - name: Set artifact name
        id: artifact-name
        run: echo "name=devchain-${{ env.PR_NUMBER }}-${{ steps.date.outputs.date }}" >> $GITHUB_OUTPUT


      - name: Upload devchain as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: packages/protocol/.tmp
          include-hidden-files: true
          # Max retention time is 90 days for public repos
          # https://docs.github.com/en/actions/learn-github-actions/usage-limits-billing-and-administration#artifact-and-log-retention-policy
          retention-days: 90

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download devchain artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: package

      - uses: actions/setup-node@v4
        with:
          # This job only downloads an artifact and never checks out the repository,
          # so it cannot read .nvmrc. Keep the two in sync.
          node-version: '24'

      - name: Update npm for OIDC trusted publishing
        # npm is pinned to a major so a release does not pick up whatever npm@latest
        # happens to be that day; OIDC trusted publishing needs npm >= 11.5.
        run: npm install -g npm@11

      - name: Publish @celo/devchain-anvil
        run: |
          cat package.json
          npm publish $RELEASE_TYPE $DRY_RUN --access public
        working-directory: package
        env:

          RELEASE_TYPE: --tag ${{ needs.build.outputs.release_type != '' && needs.build.outputs.release_type || 'canary' }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
          DRY_RUN: ${{ needs.build.outputs.release_version == '' && '--dry-run' || '' }}
